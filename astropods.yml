# ==============================================================================
# Astropods Blueprint Specification (blueprint/v1)
# AegisPay — Autonomous Multi-Agent Fraud Defense for PayPal Commerce
# ==============================================================================

spec: blueprint/v1
name: aegispay-fraud-defense

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
    messaging: true

models:
  gemini:
    provider: google
    models:
      - gemini-2.5-flash

providers:
  paypal:
    scope:
      - integrations
    variables:
      - name: CLIENT_ID
        datatype: string
        description: "PayPal Developer Sandbox Client ID"
      - name: CLIENT_SECRET
        datatype: string
        secret: true
        description: "PayPal Developer Sandbox Client Secret"
      - name: MODE
        datatype: string
        default: "sandbox"
        description: "PayPal API Mode (sandbox or live)"

integrations:
  paypal_commerce:
    provider: paypal

ingestion:
  paypal_fraud_webhook:
    container:
      build:
        context: .
        dockerfile: Dockerfile
      port: 8080
    trigger:
      type: webhook
