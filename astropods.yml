# ==============================================================================
# Astropods Blueprint Specification (blueprint/v1)
# AegisPay — Autonomous Multi-Agent Fraud Defense for PayPal Commerce
# ==============================================================================

spec: blueprint/v1
name: aegispay-fraud-defense

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    frontend: true
    messaging: true

models:
  gemini:
    provider: google
    models:
      - gemini-2.5-flash

providers:
  paypal:
    scope:
      - integrations
    variables:
      - name: CLIENT_ID
        datatype: string
        description: "PayPal Developer Sandbox Client ID"
      - name: CLIENT_SECRET
        datatype: string
        secret: true
        description: "PayPal Developer Sandbox Client Secret"
      - name: MODE
        datatype: string
        default: "sandbox"
        description: "PayPal API Mode (sandbox or live)"
  channel3:
    scope:
      - product_intelligence
    variables:
      - name: API_KEY
        datatype: string
        secret: true
        description: "Channel3 E-Commerce API Key (100M+ Product Catalog)"
  elastic:
    scope:
      - vector_search_and_esql
    variables:
      - name: ENDPOINT
        datatype: string
        description: "Elastic Cloud Serverless Cluster Endpoint URL"
      - name: API_KEY
        datatype: string
        secret: true
        description: "Elastic Cloud API Key"

integrations:
  paypal_commerce:
    provider: paypal
  channel3_catalog:
    provider: channel3
  elastic_threat_intel:
    provider: elastic

ingestion:
  paypal_fraud_webhook:
    container:
      build:
        context: .
        dockerfile: Dockerfile
      port: 8080
    trigger:
      type: webhook
